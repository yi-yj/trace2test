services:
  admin-demo:
    build:
      context: .
      dockerfile: Dockerfile.admin
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TRACETOTEST_FAULTS: ${TRACETOTEST_FAULTS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped
